{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cliente - Alke Wallet</title>
    <link rel="stylesheet" href="{% static 'gestion/style.css' %}">
</head>
<body>

    <div class="contenedor">

        {% if object %}
            <h1>Editar cliente</h1>
        {% else %}
            <h1>Nuevo cliente</h1>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="acciones">
                <button type="submit">Guardar</button>
                <a href="{% url 'cliente-list' %}">Volver al listado</a>
            </div>
        </form>

    </div>

</body>
</html>
